[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elfa"
version = "0.0.1"
description = "EuroLeague Fantasy Agent — PIR projection and lineup optimiser"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "pyarrow>=14",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "pulp>=2.8,<3",
  "euroleague-api>=0.0.13",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter"]

[project.scripts]
elfa = "elfa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
